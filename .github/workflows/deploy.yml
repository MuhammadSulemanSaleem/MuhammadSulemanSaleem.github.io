name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Notify IndexNow (Bing) of current URLs
        continue-on-error: true
        run: |
          SITE="https://muhammadsulemansaleem.github.io"
          KEY="e19d6a737bbb47e58de786025c1ced1f"
          URLS=$(curl -s "$SITE/sitemap-0.xml" | grep -oE '<loc>[^<]*</loc>' | sed -E 's/<\/?loc>//g')
          JSON_URLS=$(printf '%s\n' "$URLS" | jq -R . | jq -s .)
          PAYLOAD=$(jq -n \
            --arg host "muhammadsulemansaleem.github.io" \
            --arg key "$KEY" \
            --arg keyLocation "$SITE/$KEY.txt" \
            --argjson urlList "$JSON_URLS" \
            '{host: $host, key: $key, keyLocation: $keyLocation, urlList: $urlList}')
          curl -s -w "\nIndexNow status: %{http_code}\n" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$PAYLOAD"
